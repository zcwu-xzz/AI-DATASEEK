user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve escaped object keys and the original signed query string.
    map $request_uri $s3_request_uri {
        ~^/api/v1/s3(?<s3_suffix>.*)$ /s3$s3_suffix;
        default /s3;
    }

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 20G;
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Stream original dataset files without spooling large responses to
        # nginx temporary files. Do not put presigned credentials in access logs.
        location ~ ^/api/v1/s3(?:/|$) {
            resolver 127.0.0.11 valid=10s;
            set $s3_gateway_url "http://filesystem-s3:8080";
            proxy_pass $s3_gateway_url$s3_request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            access_log off;
        }

        location /api/ {
            resolver 127.0.0.11 valid=10s;  # Docker DNS
            set $backend_url "${BACKEND_URL}";
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
