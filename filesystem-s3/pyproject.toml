[project]
name = "filesystem-s3"
version = "0.1.0"
description = "Independent read-only S3 gateway for existing filesystem directories"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "boto3>=1.35,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
